  version: "3.9"

  x-app-env: &app_env
    APP_ENV: production
    APP_NAME: ProcessMaker
    APP_DEBUG: "true"
    APP_KEY: "base64:XXLgKe/ZDRyZcEJU2SU4f7QPP/wcX5e8pdAqGOnsHhw="

    # ---- آدرس‌های داخلی بین سرویس‌ها ----
    APP_URL: https://bpms.clickapps.ir
    PM4_API_URL: https://bpms.clickapps.ir/api/1.0
    DOCKER_HOST_URL: https://bpms.clickapps.ir
    FORCE_HTTPS: "false"
    APP_TRUSTED_HOSTS: https://bpms.clickapps.ir

    # ---- پایگاه داده ----
    DB_DRIVER: mysql
    DB_HOST: pm-db
    DB_PORT: 3306
    DB_DATABASE: pm4
    DB_USERNAME: pmuser
    DB_PASSWORD: StrongPassword!

    DATA_DB_DRIVER: mysql
    DATA_DB_HOST: pm-db
    DATA_DB_PORT: 3306
    DATA_DB_DATABASE: pm4
    DATA_DB_USERNAME: pmuser
    DATA_DB_PASSWORD: StrongPassword!
    DATA_DB_ENGINE: InnoDB

    # ---- Pusher / Socket.io ----
    PUSHER_SCHEME: https
    PUSHER_HOST: bpms.clickapps.ir
    PUSHER_PORT: 6001

    # ---- صف و کش ----
    CACHE_STORE: array
    QUEUE_CONNECTION: redis
    REDIS_CLIENT: phpredis
    REDIS_PORT: 6379
    REDIS_HOST: pm-redis
    REDIS_PASSWORD:
    REDIS_PREFIX:
    HORIZON_PREFIX: horizon:

    # ---- سشن و کوکی ----
    SESSION_DRIVER: file
    SESSION_DOMAIN: bpms.clickapps.ir
    SESSION_SECURE_COOKIE: "true"
    SESSION_SAME_SITE: Lax

    # ---- تنظیمات اسکریپت و داکر ----
    PROCESSMAKER_SCRIPTS_HOME: /var/www/html/storage/app
    PROCESSMAKER_SCRIPTS_DOCKER: /usr/bin/docker
    PROCESSMAKER_SCRIPTS_DOCKER_MODE: binding
    PROCESSMAKER_SCRIPTS_DOCKER_PARAMS: "--network=${COMPOSE_PROJECT_NAME}_default"
    CUSTOM_EXECUTORS: "true"

    # ---- اسکریپت مایکروسرویس (غیرفعال) ----
    SCRIPT_MICROSERVICE_ENABLED: "false"

    # ---- زمان و فرمت ----
    APP_TIMEZONE: UTC
    DATE_FORMAT: "m/d/Y H:i"

    # ---- لاگ و پروکسی ----
    API_TIMEOUT: 5000
    PROXIES: "*"
    LOGOUT_OTHER_DEVICES: "false"
    BROWSER_CACHE: "true"

    # ---- Echo Server (WebSocket) ----
    BROADCAST_DRIVER: redis
    BROADCASTER_HOST: https://bpms.clickapps.ir
    BROADCASTER_KEY: changeme
    LARAVEL_ECHO_SERVER_AUTH_HOST: https://bpms.clickapps.ir
    LARAVEL_ECHO_SERVER_HOST: 0.0.0.0
    LARAVEL_ECHO_SERVER_PORT: 6001
    LARAVEL_ECHO_SERVER_DEBUG: "false"
    PUSHER_APP_ID:
    PUSHER_APP_KEY:
    PUSHER_APP_SECRET:
    PUSHER_CLUSTER:
    PUSHER_TLS: "false"
    PUSHER_DEBUG: "false"

    # ---- مسیرها ----
    HOME: /var/www/html
    TELESCOPE_ENABLED: "false"


  services:
    web:
      image: nginx:1.27-alpine
      container_name: pm-web
      depends_on:
        - app
      volumes:
        - ./:/var/www/html:rw
        - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      ports:
        - "8080:8080"
      networks: [default]

    app:
      build:
        context: .
        dockerfile: Dockerfile
      image: pm-app:latest
      container_name: pm-app
      environment:
        <<: *app_env
        # کلید اپت رو از نصب قبلی کپی کن:
        APP_KEY: "${APP_KEY}"
      volumes:
        - ./:/var/www/html:rw
        # برای اجرای docker داخل کانتینر (build/run اکزکیوتورها):
        - /var/run/docker.sock:/var/run/docker.sock
      networks: [default]
      healthcheck:
        test: ["CMD-SHELL", "php -v >/dev/null 2>&1 || exit 1"]
        interval: 30s
        timeout: 5s
        retries: 5

    horizon:
      image: pm-app:latest
      container_name: pm-horizon
      depends_on:
        - app
        - redis
      environment:
        <<: *app_env
        APP_KEY: "${APP_KEY}"
      command: ["php", "/var/www/html/artisan", "horizon"]
      volumes:
        - ./:/var/www/html:rw
        - /var/run/docker.sock:/var/run/docker.sock
      restart: unless-stopped
      networks: [default]
    echo:
      image: node:18-alpine
      container_name: pm-echo
      working_dir: /var/www/html
      command: >
        sh -lc "
        apk add --no-cache bash git python3 make g++ || true &&
        npx --yes laravel-echo-server@1.6.3 start
        "
      volumes:
        - ./:/var/www/html
      depends_on:
        - redis
        - app
      ports:
        - "6001:6001"
      environment:
        NODE_ENV: production
      restart: unless-stopped
      networks: [default]


    scheduler:
      image: pm-app:latest
      container_name: pm-scheduler
      depends_on:
        - app
      environment:
        <<: *app_env
        APP_KEY: "${APP_KEY}"
      entrypoint: ["/bin/sh","-lc","while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"]
      volumes:
        - ./:/var/www/html:rw
        - /var/run/docker.sock:/var/run/docker.sock
      restart: unless-stopped
      networks: [default]

    redis:
      image: redis:7-alpine
      container_name: pm-redis
      networks: [default]

    db:
      image: mysql:8.0
      container_name: pm-db
      command: ["mysqld","--default-authentication-plugin=mysql_native_password","--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci"]
      environment:
        MYSQL_DATABASE: pm4
        MYSQL_USER: pmuser
        MYSQL_PASSWORD: StrongPassword!
        MYSQL_ROOT_PASSWORD: StrongRootPW!
      volumes:
        - pm-mysql:/var/lib/mysql
      networks: [default]
      healthcheck:
        test: ["CMD-SHELL","mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
        interval: 20s
        timeout: 5s
        retries: 10

  volumes:
    pm-mysql:
