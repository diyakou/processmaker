version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - storage:/var/www/html/storage
      - vendor:/var/www/html/vendor
    depends_on:
      - mysql
      - redis
    networks:
      - pm

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - app
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pm

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: processmaker
      MYSQL_USER: processmaker
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "33060:3306"
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - pm

  redis:
    image: redis:7-alpine
    networks:
      - pm

  horizon:
    restart: unless-stopped
    depends_on:
      - app
      - redis
    image: composer:2
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    entrypoint: ["sh","-lc","php artisan horizon"]
    networks:
      - pm

  scheduler:
    restart: unless-stopped
    depends_on:
      - app
    image: composer:2
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    entrypoint: ["sh","-lc","while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    networks:
      - pm

  echo-server:
    image: node:18-alpine
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -lc "npx --yes laravel-echo-server start --force"
    ports:
      - "6001:6001"
    networks:
      - pm

networks:
  pm:

volumes:
  storage:
  vendor:
  mysql:


