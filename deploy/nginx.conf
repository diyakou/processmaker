server {
    listen 8080;
    server_name 192.168.85.167 bpms.clickapps.ir _;

    root /var/www/html/public;
    index index.php index.html;

    # فایل‌های استاتیک و روت اصلی
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        # امنیت: جلوگیری از اجرا شدن هر فایل .php که واقعاً وجود نداره
        try_files $uri =404;

        include fastcgi_params;              # روی nginx:alpine معمولاً درست است
        fastcgi_pass pm-app:9000;            # اسم سرویس PHP-FPM در داکر
        fastcgi_index index.php;

        # مسیر اسکریپت برای PHP-FPM
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # اگه PATH_INFO لازم ندارید، می‌تونید حذفش کنید
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # بهبود کارایی
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    # وب‌سوکت‌ها (Laravel Echo / Socket.IO)
    location /socket.io/ {
        proxy_pass http://pm-echo:6001;
        proxy_http_version 1.1;

        # ارتقاء اتصال برای وب‌سوکت
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # هدرهای معمول
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # تایم‌اوت‌ها
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # محدودیت آپلود (در صورت نیاز)
    client_max_body_size 20m;
}
