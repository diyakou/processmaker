server {
    listen 8080;
    server_name 192.168.85.167 bpms.clickapps.ir _;

    root /var/www/html/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass pm-app:9000;
        fastcgi_index index.php;

        # مسیر فایل php
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # 👇 این‌ها را اضافه کن (خیلی مهم)
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTPS on;                       # اگر TLS جلوتر terminate شده
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;   # پشت HTTPS هستی

        # (اختیاری) اگر نیاز نداری حذف کن
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://pm-echo:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    client_max_body_size 20m;
}
