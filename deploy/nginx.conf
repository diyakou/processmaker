server {
    listen 8081;
    server_name bpms.clickapps.ir 192.168.85.167 _;

    root /var/www/html/public;
    index index.php index.html;

    # اپ‌های لاراول: همه‌ی روت‌ها برن سمت index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        # ترجیحاً از fastcgi.conf استفاده کن (نسبت به fastcgi_params کامل‌تره)
        include fastcgi.conf;               # اگر در توزیعت نیست، همون fastcgi_params + خطوط زیر

        fastcgi_pass pm-app:9000;
        fastcgi_index index.php;

        # اگر از fastcgi_params استفاده می‌کنی، این دو خط ضروری‌اند:
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # ===== هدرهای مهم پشت پروکسی =====
        # بر اساس طرح واقعی (http/https) و پورت فعلی پاس بده
        fastcgi_param HTTPS $https;

        # هدرهای فورواردشده که فریم‌ورک می‌خواند (در صورت حضور از LB/Proxy گرفته می‌شود)
        fastcgi_param HTTP_HOST               $host;
        fastcgi_param HTTP_X_FORWARDED_HOST   $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO  $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PORT   $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_FOR    $proxy_add_x_forwarded_for;

        # بافرها (اوکی‌اند)
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    # وب‌سوکت Echo (خوبه؛ فقط هدر Host/Forwarded رو هم داری)
    location /socket.io/ {
        proxy_pass http://pm-echo:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    client_max_body_size 20m;
}
