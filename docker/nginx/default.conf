map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream echo {
  server echo-server:6001;
}

server {
  listen 80;
  server_name _;

  root /var/www/html/public;

  index index.php index.html;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

location ~ \.php$ {
    include fastcgi_params;

    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param PATH_INFO       $fastcgi_path_info;

    fastcgi_pass app:9000;
    fastcgi_read_timeout 300;

    # مهم: این‌ها رو اضافه کن تا PHP بدونه پشت HTTPS بوده
    fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
    fastcgi_param HTTP_X_FORWARDED_HOST  $host;
    fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;   # یا: $http_x_forwarded_proto

    # در صورتی که مطمئنی همیشه از طریق HTTPS میای:
    # fastcgi_param HTTPS on;
}

  location ~* \.(?:css|js|woff2?|ttf|eot|otf|svg|jpg|jpeg|png|gif|webp)$ {
    expires 7d;
    access_log off;
    add_header Cache-Control "public";
  }

  location /socket.io/ {
    proxy_pass http://0.0.0.0:6001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }
}


